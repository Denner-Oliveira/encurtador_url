{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">
    <title>Encurtador de URLs</title>
    <link rel="stylesheet" href="{% static 'encurtador/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/" aria-label="Encurtador de URLs - página inicial">
            <span class="brand-mark" aria-hidden="true">Encurtador</span>            
        </a>
    </header>

    <main class="page-content">
        <section class="container" aria-labelledby="page-title">
            <div class="intro">
                <h1 id="page-title">Encurtador de URLs</h1>
                <p class="descricao">Transforme uma URL longa em um link curto.</p>
            </div>

            <form id="formEncurtador">

                <div class="campo">
                    <label for="url">URL original</label>
                    <input type="url" id="url" name="url" placeholder="https://www.exemplo.com/pagina" required >
                </div>

                <div class="campo">
                    <label for="dt_expiracao">
                        Data de expiração
                        <span class="optional">(opcional)</span>
                    </label>
                    <input type="date" id="dt_expiracao" name="dt_expiracao" min="" >
                </div>

                <button type="submit" id="btnEncurtar">Encurtar URL</button>
            </form>

            <div class="carregando" id="carregando" role="status" aria-live="polite">
                Gerando link...
            </div>

            <div class="erro" id="erro" role="alert"></div>

            <div class="resultado" id="resultado">
                <h2>URL encurtada</h2>
                <div class="link-container">
                    <input type="text" id="urlEncurtada" aria-label="URL encurtada" readonly>
                    <button type="button" class="btn-copiar" id="btnCopiar"> Copiar</button>
                </div>
            </div>

            <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid #e8edf5;">
    <h2 style="margin-bottom: 6px; font-size: 16px;">Excluir URL encurtada</h2>
    <p style="margin-bottom: 14px; color: #778197; font-size: 13px;">
        Informe o código da URL que deseja excluir.
    </p>

    <form id="formDeletaUrl">
        <div class="campo">
            <label for="codigoUrl">Código da URL</label>
            <input
                type="text"
                id="codigoUrl"
                placeholder="Ex.: a1b2c3"
                required
            >
        </div>

        <button type="submit" id="btnDeletarUrl" style="background: #c0392b;">
            Excluir URL
        </button>
    </form>

    <p id="statusDeletaUrl" role="status" aria-live="polite" style="margin-top: 12px;"></p>
    
</div>
        </section>
    </main>

    <footer class="site-footer">

    </footer>

    <script src="{% static 'encurtador/js/index.js' %}"></script>
</body>
</html>
