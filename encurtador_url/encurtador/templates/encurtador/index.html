{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">
    <title>Encurtador de URLs</title>
    <link rel="stylesheet" href="{% static 'encurtador/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/" aria-label="Encurtador de URLs - página inicial">
            <span class="brand-mark" aria-hidden="true">u/</span>
            <span>Encurtador</span>
        </a>
        <span class="header-note">Links curtos, compartilhamento simples</span>
    </header>

    <main class="page-content">
        <section class="container" aria-labelledby="page-title">
            <div class="intro">
                <span class="eyebrow">SIMPLES&nbsp; · &nbsp;RÁPIDO&nbsp; · &nbsp;DIRETO</span>
                <h1 id="page-title">Encurtador de URLs</h1>
                <p class="descricao">Transforme uma URL longa em um link curto.</p>
            </div>

            <form id="formEncurtador">
                {% csrf_token %}

                <div class="campo">
                    <label for="url">URL original</label>
                    <input
                        type="url"
                        id="url"
                        name="url"
                        placeholder="https://www.exemplo.com/pagina"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="dt_expiracao">
                        Data de expiração
                        <span class="optional">(opcional)</span>
                    </label>
                    <input
                        type="date"
                        id="dt_expiracao"
                        name="dt_expiracao"
                        min=""
                    >
                </div>

                <button type="submit" id="btnEncurtar">Encurtar URL</button>
            </form>

            <div class="carregando" id="carregando" role="status" aria-live="polite">
                Gerando link...
            </div>

            <div class="erro" id="erro" role="alert"></div>

            <div class="resultado" id="resultado">
                <h2>URL encurtada</h2>
                <div class="link-container">
                    <input
                        type="text"
                        id="urlEncurtada"
                        aria-label="URL encurtada"
                        readonly
                    >
                    <button type="button" class="btn-copiar" id="btnCopiar">
                        Copiar
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <span>Feito para compartilhar melhor.</span>
        <a
            href="https://github.com/Denner-Oliveira/encurtador_url"
            target="_blank"
            rel="noopener noreferrer"
        >
            Ver projeto no GitHub <span aria-hidden="true">↗</span>
        </a>
    </footer>

    <script src="{% static 'encurtador/js/index.js' %}"></script>
</body>
</html>
